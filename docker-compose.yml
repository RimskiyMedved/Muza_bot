# ─── Сеть ─────────────────────────────────────────────────────────────────────
networks:
  muza_net:
    driver: bridge

services:

  # ── Telegram-бот ────────────────────────────────────────────────────────────
  muza_bot:
    build: .
    command: python bot.py
    env_file: .env
    restart: unless-stopped
    networks: [muza_net]
    volumes:
      - ./database.db:/app/database.db
      - ./credentials.json:/app/credentials.json
      # bot_state.json удалён — состояние теперь в SQLite

  # ── FastAPI для Mini App ─────────────────────────────────────────────────────
  # Наружу отдаётся системным nginx на https://bot.muzal-moscow.ru → 127.0.0.1:8001.
  muza_api:
    build: .
    command: >
      uvicorn api:app
      --host 0.0.0.0
      --port 8001
      --reload
      --log-level info
    env_file: .env
    restart: unless-stopped
    networks: [muza_net]
    ports:
      - "127.0.0.1:8001:8001"   # только localhost — наружу проксирует nginx
    volumes:
      - ./database.db:/app/database.db
      - ./credentials.json:/app/credentials.json
      - ./webapp:/app/webapp   # hot-reload: изменения без rebuild
      - ./api.py:/app/api.py   # hot-reload: изменения без rebuild
      - ./sheets.py:/app/sheets.py
      - ./database.py:/app/database.py
      - ./utils.py:/app/utils.py
      - ./config.py:/app/config.py

  # HTTPS обслуживает системный nginx (Caddy убран — порты 80/443 заняты nginx).
